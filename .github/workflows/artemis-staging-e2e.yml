name: artemis-staging-e2e

on:
  workflow_dispatch:
    inputs:
      rider_ref:
        description: "Branche Galass_Rider"
        default: "fix/multistop-close"
        type: string
      driver_ref:
        description: "Branche Galass_Driver"
        default: "fix/multistop-close"
        type: string
      model:
        description: "Modèle Artemis (freellmapi)"
        default: "gemini-2.5-flash"
        type: string

permissions:
  contents: read

concurrency:
  group: artemis-staging-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      BASE: ${{ secrets.GALASS_STAGING_URL }}
      RIDER_ID: "106"
      DRIVER_ID: "23"
      OUT: e2e-out
      # Chaîne des échéances (vérifiée par e2e/tests) : watchdog 90 < step 100 < job 150.
      # Le harnais rend son verdict partiel AVANT que le step soit coupé, et le step
      # coupe AVANT que le job meure — les étapes `if: always()` (preuves) survivent.
      RUN_DEADLINE_MIN: "90"
      APK_RIDER: apk/rider/app-debug.apk
      APK_DRIVER: apk/driver/app-debug.apk
      RIDER_TOKEN: ${{ secrets.GALASS_E2E_RIDER_TOKEN }}
      DRIVER_TOKEN: ${{ secrets.GALASS_E2E_DRIVER_TOKEN }}
      DEV_TOKEN: ${{ secrets.GALASS_E2E_DEV_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.FREELLMAPI_KEY }}
      OPENAI_BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
      ARTEMIS_DEFAULT_MODEL: ${{ inputs.model }}
      ARTEMIS_USE_USER_DIR: "false"
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Garde staging
        run: |
          python3 e2e/base_guard.py "$BASE"
          case "$BASE" in *galassapp.com*) echo "BASE ne doit pas être la prod"; exit 1;; esac
          h="${BASE#*://}"; h="${h%%[:/]*}"; echo "::add-mask::$h"
          echo "STAGING_HOST=$h" >> "$GITHUB_ENV"
          echo "GALASS_STAGING_URL=$BASE" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with: {repository: LordThiouk/Galass_Rider, ref: "${{ inputs.rider_ref }}", token: "${{ secrets.GALASS_REPO_TOKEN }}", path: src/rider, persist-credentials: false}
      - uses: actions/checkout@v4
        with: {repository: LordThiouk/Galass_Driver, ref: "${{ inputs.driver_ref }}", token: "${{ secrets.GALASS_REPO_TOKEN }}", path: src/driver, persist-credentials: false}
      - name: Libérer disque
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules /opt/microsoft /opt/google/chrome /usr/local/share/powershell || true
          sudo docker image prune --all --force >/dev/null || true
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        with: {flutter-version: "3.44.8", channel: stable, cache: true}
      - name: Licences Android + NDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "ndk;29.0.14033849" "ndk;28.2.13676358" > /dev/null
      - name: Keystore debug fixe (JKS, SHA-1 stable pour la clé Maps)
        env: {KS: "${{ secrets.DEBUG_KEYSTORE_B64 }}"}
        run: |
          umask 077; mkdir -p ~/.android
          printf '%s' "$KS" | base64 -d > /tmp/dbg.p12
          rm -f ~/.android/debug.keystore
          keytool -importkeystore -noprompt -srckeystore /tmp/dbg.p12 -srcstoretype PKCS12 -srcstorepass android \
            -srcalias androiddebugkey -destkeystore ~/.android/debug.keystore -deststoretype JKS \
            -deststorepass android -destkeypass android -destalias androiddebugkey 2>&1 | grep -v -i warning || true
          rm -f /tmp/dbg.p12
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep -E "Store type|Keystore type|SHA1:"
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | awk '/SHA1:/{print $2}' > /tmp/expected_sha1
          test -s /tmp/expected_sha1
          # AGP peut résoudre le keystore debug ailleurs que dans $HOME/.android: on réplique
          # le même fichier partout où les outils Android le cherchent.
          for d in "$HOME/.android" "${ANDROID_SDK_HOME:-$HOME}/.android" "${ANDROID_PREFS_ROOT:-$HOME}/.android" "$ANDROID_HOME/.android"; do
            mkdir -p "$d" 2>/dev/null || continue
            cp -f ~/.android/debug.keystore "$d/debug.keystore" 2>/dev/null || true
          done
          [ -n "${ANDROID_USER_HOME:-}" ] && cp -f ~/.android/debug.keystore "$ANDROID_USER_HOME/debug.keystore" 2>/dev/null || true
          # Init script global: force la signature debug sur CE keystore (aucun fichier projet modifié).
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/zz-debug-signing.gradle <<'GRADLE'
          allprojects { proj ->
            proj.plugins.withId('com.android.application') {
              proj.afterEvaluate {
                try {
                  def android = proj.extensions.findByName('android')
                  if (android == null) return
                  def sc = android.signingConfigs.findByName('debug')
                  if (sc == null) sc = android.signingConfigs.create('debug')
                  sc.storeFile = new File(System.getenv('HOME'), '.android/debug.keystore')
                  sc.storePassword = 'android'
                  sc.keyAlias = 'androiddebugkey'
                  sc.keyPassword = 'android'
                  def bt = android.buildTypes.findByName('debug')
                  if (bt != null) bt.signingConfig = sc
                  proj.logger.lifecycle("debug signing force sur ~/.android/debug.keystore")
                } catch (Throwable t) {
                  proj.logger.lifecycle("debug-signing init ignore: ${t.message}")
                }
              }
            }
          }
          GRADLE
          echo "init script: $(wc -l < ~/.gradle/init.d/zz-debug-signing.gradle) lignes"
      - name: Build APK (staging, debug, même job, pas d'upload)
        run: |
          for a in rider driver; do
            (cd src/$a && flutter pub get >/dev/null && flutter build apk --debug --dart-define=API_BASE_URL="$BASE" 2>&1 | tail -n 15; test -f build/app/outputs/flutter-apk/app-debug.apk && (unzip -p build/app/outputs/flutter-apk/app-debug.apk "META-INF/*.RSA" 2>/dev/null | openssl pkcs7 -inform DER -print_certs 2>/dev/null | openssl x509 -noout -fingerprint -sha1 || true))
            mkdir -p apk/$a && cp src/$a/build/app/outputs/flutter-apk/app-debug.apk apk/$a/
          done
          rm -rf src
      - name: Vérifier la signature des APK (apksigner)
        run: |
          AS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          exp=$(cat /tmp/expected_sha1); echo "attendu: $exp"
          echo "HOME=$HOME ANDROID_SDK_HOME=${ANDROID_SDK_HOME:-} ANDROID_PREFS_ROOT=${ANDROID_PREFS_ROOT:-} ANDROID_USER_HOME=${ANDROID_USER_HOME:-}"
          find "$HOME" "$ANDROID_HOME" /usr/local/lib/android /opt /tmp -name debug.keystore 2>/dev/null | while read -r f; do
            printf 'keystore %s ' "$f"; keytool -list -v -keystore "$f" -storepass android 2>/dev/null | awk '/SHA1:/{print $2; exit}'
          done
          sha1_of() { "$AS" verify --print-certs "$1" | awk '/SHA-1 digest/{print toupper($NF)}' | head -1 | sed 's/../&:/g;s/:$//'; }
          rc=0
          for a in rider driver; do
            "$AS" verify --print-certs apk/$a/app-debug.apk | grep -E "Signer|SHA-1|DN"
            got=$(sha1_of apk/$a/app-debug.apk)
            echo "$a SHA-1 APK (build): $got"
            if [ "$got" != "$exp" ]; then
              # Le build a signé avec un autre certificat: re-signature explicite avec le keystore fixe.
              cp apk/$a/app-debug.apk "apk/$a/app-unsigned.apk"
              "$AS" sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android \
                --ks-key-alias androiddebugkey --out apk/$a/app-debug.apk "apk/$a/app-unsigned.apk"
              rm -f "apk/$a/app-unsigned.apk"
              got=$(sha1_of apk/$a/app-debug.apk)
              echo "$a SHA-1 APK (re-signé): $got"
            fi
            echo "APK_SHA1_$(echo "$a" | tr a-z A-Z)=$got" >> "$GITHUB_ENV"
            [ "$got" = "$exp" ] || { echo "::warning::$a signé avec un autre certificat que la clé Maps"; rc=1; }
          done
          echo "APK_SHA1_TARGET=$exp" >> "$GITHUB_ENV"
          [ $rc -eq 0 ] && echo "SHA-1 APK = certificat Maps attendu" || echo "::warning::SHA-1 APK != certificat Maps (run poursuivi, voir apk-sha1)"
          # Libérer la RAM: les daemons Gradle (Xmx6g) restent vivants et étouffent l'émulateur (ANR / QEMU hang)
          pkill -f GradleDaemon || true; pkill -f KotlinCompileDaemon || true; sleep 3; free -m
      - name: Activer KVM (règle udev officielle)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          echo "Runner: $(nproc) vCPU, $(awk '/MemTotal/{print int($2/1024)}' /proc/meminfo) Mo RAM"

      # Run 40602473815: scrcpy absent de l'image du runner -> aucun screens-reel,
      # aucun grader d'écran. L'apt de noble ne fournit que scrcpy 1.25, qui refuse
      # `--video-bit-rate` et `--capture-orientation=@` utilisés par Artemis : on
      # installe la release upstream épinglée et on ASSERT le plancher >= 3.0.
      - name: Installer scrcpy (capture d'écran du run)
        run: |
          # ffmpeg CLI: requis par Artemis pour convertir les segments scrcpy (mkv -> mp4).
          # Le binaire scrcpy de la release est lié statiquement (SDL + libav inclus).
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          curl -fsSL --retry 3 -o /tmp/scrcpy.tar.gz \
            "https://github.com/Genymobile/scrcpy/releases/download/v3.3.4/scrcpy-linux-x86_64-v3.3.4.tar.gz"
          echo "0305d98c06178c67e12427bbf340c436d0d58c9e2a39bf9ffbbf8f54d7ef95a5  /tmp/scrcpy.tar.gz" | sha256sum -c -
          sudo mkdir -p /opt/scrcpy-v3.3.4
          sudo tar -xzf /tmp/scrcpy.tar.gz -C /opt/scrcpy-v3.3.4 --strip-components=1
          sudo ln -sf /opt/scrcpy-v3.3.4/scrcpy /usr/local/bin/scrcpy
          rm -f /tmp/scrcpy.tar.gz
          scrcpy --version
          # Plancher dur: un scrcpy < 3.0 ignore les flags d'Artemis et produirait
          # un run complet sans aucune capture — on échoue ici, pas 90 min plus tard.
          v="$(scrcpy --version | awk 'NR==1 && $1=="scrcpy" {print $2}')"
          echo "scrcpy version détectée: '${v}'"
          [ -n "$v" ] || { echo "::error::version scrcpy illisible"; exit 1; }
          major="${v%%.*}"
          [ "$major" -ge 3 ] || { echo "::error::scrcpy ${v} < 3.0 — flags Artemis non supportés"; exit 1; }

      - uses: astral-sh/setup-uv@v5

      - name: Installer Artemis (vendor)
        run: |
          cd vendor/artemis
          uv sync --no-dev
          .venv/bin/artemis --version

      - name: Tests du harnais (syntaxe + contrats)
        run: |
          bash -n e2e/*.sh
          python3 -m py_compile e2e/*.py
          # Toute nouvelle spec e2e/tests/test_*.py tourne ici sans édition du workflow.
          for t in e2e/tests/test_*.py; do echo "== $t"; python3 "$t"; done

      - name: E2E multistop (Artemis + API fallback)
        timeout-minutes: 100
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          script: bash e2e/run.sh

      - name: Chiffrer les preuves
        if: always()
        env: {PASS: "${{ secrets.E2E_ARCHIVE_PASS }}"}
        run: |
          mkdir -p e2e-out; tar czf ev.tgz e2e-out
          printf '%s' "$PASS" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 -o evidence.tgz.gpg ev.tgz
          rm -f ev.tgz
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: staging-e2e-evidence-encrypted, path: evidence.tgz.gpg, retention-days: 7}
      - name: Publier le smoke log (masqué)
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: staging-e2e-smoke-log, path: e2e/smoke.log, retention-days: 7, if-no-files-found: warn}
      - name: Résumé (PASS/FAIL seulement)
        if: always()
        run: |
          echo "| étape | résultat |" >> "$GITHUB_STEP_SUMMARY"; echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          if [ -f e2e-out/results.txt ]; then awk -F'|' '{print "| "$1" | "$2" |"}' e2e-out/results.txt >> "$GITHUB_STEP_SUMMARY"; else echo "| run | no results |" >> "$GITHUB_STEP_SUMMARY"; fi
