name: patrol-pilot
# Pilote Patrol NON bloquant, séparé du job e2e (contrat d'étapes inchangé).
# Relance 2026-11-02 : bascule e2e vers Patrol (OK Papa).
on:
  # push : workflow_dispatch exige le fichier sur la branche par défaut (pas de merge).
  push:
    branches: [fix/e2e-vision-chain]
    paths: [.github/workflows/patrol-pilot.yml]
  workflow_dispatch:
    inputs:
      rider_ref: {description: "Branche Galass_Rider", default: "feat/patrol-pilot", type: string}
permissions:
  contents: read
jobs:
  patrol-pilot:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    env:
      BASE: ${{ secrets.GALASS_STAGING_URL }}
      RIDER_TEST_PHONE: ${{ secrets.RIDER_TEST_PHONE }}
      RIDER_TEST_OTP: ${{ secrets.RIDER_TEST_OTP }}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Garde staging
        run: |
          python3 e2e/base_guard.py "$BASE"
          case "$BASE" in *galassapp.com*) echo "BASE ne doit pas être la prod"; exit 1;; esac
      - uses: actions/checkout@v4
        with: {repository: LordThiouk/Galass_Rider, ref: "${{ inputs.rider_ref || 'feat/patrol-pilot' }}", token: "${{ secrets.GALASS_REPO_TOKEN }}", path: src/rider, persist-credentials: false}
      - name: Pilote présent ?
        id: has
        run: test -f src/rider/patrol_test/rider_home_destination_test.dart && echo ok=1 >> "$GITHUB_OUTPUT" || echo "pas de patrol_test sur la branche rider"
      - uses: actions/setup-java@v4
        if: steps.has.outputs.ok == '1'
        with: {distribution: temurin, java-version: "17"}
      - uses: subosito/flutter-action@v2
        if: steps.has.outputs.ok == '1'
        with: {flutter-version: "3.44.8", channel: stable, cache: true}
      - name: Activer KVM
        if: steps.has.outputs.ok == '1'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: patrol_cli
        if: steps.has.outputs.ok == '1'
        run: dart pub global activate patrol_cli && echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      # Diagnostic : isoler le build de l'exécution. Si le run bloque ici, c'est le
      # build (gradle/patrol build) ; sinon c'est la phase test sur émulateur.
      - name: Accepter licences Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Réparer NDK Android (source.properties manquant)
        run: |
          NDK="$ANDROID_HOME/ndk/28.2.13676358"
          if [ ! -f "$NDK/source.properties" ]; then
            rm -rf "$NDK"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null
          fi
          ls "$NDK/source.properties"
      - name: Clé de debug fixe (SHA-1 enregistré dans Firebase)
        env:
          KS: ${{ secrets.CI_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::secret CI_DEBUG_KEYSTORE_B64 absent"; exit 1; fi
          mkdir -p ~/.android
          echo "$KS" | base64 -d > ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey | grep "SHA1:"
      - name: Clé API de test CI (Firebase phone auth, CI seulement)
        env:
          CIK: ${{ secrets.CI_FIREBASE_TEST_API_KEY }}
        run: |
          if [ -z "$CIK" ]; then echo "::error::secret CI_FIREBASE_TEST_API_KEY absent"; exit 1; fi
          cd src/rider
          sed -i "s/AIzaSyBaK[0-9A-Za-z_-]*x0GI/$CIK/g" lib/firebase_options.dart android/app/google-services.json
          grep -c "AIzaSyBaK" lib/firebase_options.dart android/app/google-services.json || true
      - name: Build APK (patrol build, hors émulateur)
        if: steps.has.outputs.ok == '1'
        working-directory: src/rider
        timeout-minutes: 25
        run: |
          flutter pub get
          patrol build android -t patrol_test/rider_home_destination_test.dart \
            --dart-define=E2E=true \
            --dart-define=API_BASE_URL="$BASE" \
            --dart-define=RIDER_TEST_PHONE="$RIDER_TEST_PHONE" \
            --dart-define=RIDER_TEST_OTP="$RIDER_TEST_OTP" \
            || { echo "::warning::patrol build a échoué — fallback flutter build apk --debug"; \
                 flutter build apk --debug \
                   --dart-define=API_BASE_URL="$BASE" \
                   --dart-define=RIDER_TEST_PHONE="$RIDER_TEST_PHONE" \
                   --dart-define=RIDER_TEST_OTP="$RIDER_TEST_OTP"; }
      - name: Patrol (rider accueil + login + destination)
        if: steps.has.outputs.ok == '1'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096
          disable-animations: true
          emulator-options: -no-window -gpu guest -noaudio -no-boot-anim -camera-back none -no-snapshot
          working-directory: src/rider
          script: bash "$GITHUB_WORKSPACE/.github/scripts/patrol-run.sh"
      - name: Artefacts diagnostics (logcat + logs patrol)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patrol-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            src/rider/logcat.txt
            src/rider/patrol-test.log
            src/rider/build/patrol/**
            src/rider/patrol_logs/**
